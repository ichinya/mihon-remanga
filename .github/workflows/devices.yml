name: Обновить график устройств

on:
  schedule:
    - cron: "37 18 * * *" # 23:37 по Екатеринбургу
  workflow_dispatch:

concurrency:
  group: device-statistics
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Обновить данные и график
        run: |
          python -m pip install --disable-pip-version-check matplotlib==3.10.8
          python .github/scripts/update_devices.py
      - name: Сохранить статистику
        run: |
          git add -- stats/devices.csv stats/devices.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update daily device statistics [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
